<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
    <div class="page-wrapper">
        <!-- 로또 섹션 -->
        <div class="container">
            <h1>🎱 로또 번호 생성기</h1>
            <div id="lotto-sets"></div>
            <div class="bonus-option">
                <label>
                    <input type="checkbox" id="bonus-check"> 보너스 번호 포함
                </label>
            </div>
            <div class="controls">
                <button id="generate">번호 생성</button>
            </div>
        </div>

        <!-- 저녁 메뉴 섹션 -->
        <div class="container">
            <h1>🍽️ 오늘 저녁 뭐 먹지?</h1>
            <div id="menu-result" class="menu-result"></div>
            <div class="controls">
                <button id="recommend">메뉴 추천받기</button>
            </div>
        </div>

        <!-- 제휴 문의 섹션 -->
        <div class="container">
            <h1>🤝 제휴 문의</h1>
            <p class="form-desc">제휴 및 협업 문의를 남겨주시면 검토 후 연락드리겠습니다.</p>
            <form id="contact-form" action="https://formspree.io/f/xlgpogoq" method="POST">
                <div class="form-group">
                    <label for="name">이름 / 회사명</label>
                    <input type="text" id="name" name="name" placeholder="홍길동 / (주)회사명" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="4" placeholder="제휴 관련 내용을 자유롭게 작성해 주세요." required></textarea>
                </div>
                <div class="controls">
                    <button type="submit">문의 보내기</button>
                </div>
                <p id="form-status" class="form-status"></p>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
